<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 1</title>
    <style>
        .error {
      color: red;
      font-size: 0.9em;
        }
    </style>
</head>
<body>

  <form id="miFormulario" action="grabar.php" method="post">
    <fieldset>
      <label for="nombre">Nombre:</label>
      <input 
        type="text" 
        id="nombre" 
        name="nombre" 
        placeholder="Tu nombre" 
        pattern=".{1,}" 
        title="El nombre no puede estar vacío" 
        required>
      <span id="errorNombre" class="error"></span>

      <label for="email">Email:</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        placeholder="Tu correo" 
        pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$" 
        title="Introduce un correo electrónico válido (ej: usuario@dominio.com)" 
        required>
      <span id="errorEmail" class="error"></span>

      <label for="contraseña">Contraseña:</label>
      <input 
        type="password" 
        id="contraseña" 
        name="contraseña" 
        placeholder="Tu contraseña" 
        pattern="^(?=.*\\d).{8,}$"
        title="Debe tener al menos 8 caracteres e incluir al menos un número" 
        required>
      <span id="errorContraseña" class="error"></span>

      <label for="contraseña_repetida">Repite contraseña:</label>
      <input 
        type="password" 
        id="contraseña_repetida" 
        name="contraseña_repetida" 
        placeholder="Repite contraseña" 
        pattern="^(?=.*\\d).{8,}$"
        title="Debe coincidir con la contraseña anterior" 
        required>
      <span id="errorContraseña2" class="error"></span>

      <div id="captcha"></div>

      <label for="resultado">Resultado de suma:</label>
      <input 
        type="number" 
        id="resultado" 
        name="resultado" 
        placeholder="Resultado de la suma" 
        title="Introduce el resultado correcto de la suma" 
        required>
      <span id="errorCaptcha" class="error"></span>

      <div style="margin-top:10px;">
        <input type="checkbox" id="condiciones" name="condiciones" value="Aceptar">
        <label for="condiciones">Acepto las condiciones</label>
      </div>

      <button id="enviar" name="enviar" type="submit" disabled>Enviar</button>
    </fieldset>
  </form>

  <script>
    // Referencias
    const formulario = document.getElementById("miFormulario");
    const nombre = document.getElementById("nombre");
    const email = document.getElementById("email");
    const pass = document.getElementById("contraseña");
    const pass2 = document.getElementById("contraseña_repetida");
    const resultado = document.getElementById("resultado");
    const condiciones = document.getElementById("condiciones");
    const botonEnviar = document.getElementById("enviar");

    // Spans de error
    const errorNombre = document.getElementById("errorNombre");
    const errorEmail = document.getElementById("errorEmail");
    const errorContraseña = document.getElementById("errorContraseña");
    const errorContraseña2 = document.getElementById("errorContraseña2");
    const errorCaptcha = document.getElementById("errorCaptcha");

    // Captcha aleatorio
    const captchaDiv = document.getElementById("captcha");
    let n1 = Math.floor(Math.random() * 10);
    let n2 = Math.floor(Math.random() * 10);
    let sumaCorrecta = n1 + n2;
    captchaDiv.innerHTML = `<p>¿Cuánto es ${n1} + ${n2}?</p>`;

    // Activar botón solo si se aceptan las condiciones
    condiciones.addEventListener("change", () => {
      botonEnviar.disabled = !condiciones.checked;
    });

    // Validaciones individuales
    nombre.addEventListener("blur", () => {
      errorNombre.textContent = nombre.value.trim() === "" ? "El nombre no puede estar vacío." : "";
    });

    email.addEventListener("blur", () => {
      const patronEmail = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
      errorEmail.textContent = !patronEmail.test(email.value) ? "Introduce un correo electrónico válido." : "";
    });

    pass.addEventListener("blur", () => {
      const patronPass = /^(?=.*\d).{8,}$/;
      errorContraseña.textContent = !patronPass.test(pass.value) ? "Debe tener al menos 8 caracteres y un número." : "";
    });

    pass2.addEventListener("blur", () => {
      errorContraseña2.textContent = pass2.value !== pass.value ? "Las contraseñas no coinciden." : "";
    });

    resultado.addEventListener("blur", () => {
      errorCaptcha.textContent = parseInt(resultado.value) !== sumaCorrecta ? "Resultado incorrecto." : "";
    });

    // Validación al enviar (sin cambiar el funcionamiento del botón)
    formulario.addEventListener("submit", (e) => {
      let valido = true;

      if (nombre.value.trim() === "") {
        errorNombre.textContent = "El nombre no puede estar vacío.";
        nombre.focus();
        valido = false;
      }

      const patronEmail = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
      if (!patronEmail.test(email.value)) {
        errorEmail.textContent = "Correo electrónico no válido.";
        if (valido) email.focus();
        valido = false;
      }

      const patronPass = /^(?=.*\d).{8,}$/;
      if (!patronPass.test(pass.value)) {
        errorContraseña.textContent = "Debe tener al menos 8 caracteres y un número.";
        if (valido) pass.focus();
        valido = false;
      }

      if (pass2.value !== pass.value) {
        errorContraseña2.textContent = "Las contraseñas no coinciden.";
        if (valido) pass2.focus();
        valido = false;
      }

      if (parseInt(resultado.value) !== sumaCorrecta) {
        errorCaptcha.textContent = "Resultado incorrecto.";
        if (valido) resultado.focus();
        valido = false;
      }

      if (!condiciones.checked) {
        alert("Debes aceptar las condiciones antes de continuar.");
        valido = false;
      }

      if (!valido) {
        e.preventDefault(); // evita el envío si hay errores
      } else {
        alert("Formulario enviado correctamente ✅");

        // Reiniciar formulario y captcha
        formulario.reset();
        botonEnviar.disabled = true;
        n1 = Math.floor(Math.random() * 10);
        n2 = Math.floor(Math.random() * 10);
        sumaCorrecta = n1 + n2;
        captchaDiv.innerHTML = `<p>¿Cuánto es ${n1} + ${n2}?</p>`;
        e.preventDefault(); // evita redirección para fines de prueba
      }
    });
  </script>
</body>
</html>
